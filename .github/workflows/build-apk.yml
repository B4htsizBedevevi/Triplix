name: Build TRIPLIX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Normalize TRIPLIX source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ('TriplixV2.kt', 'TriplixV3.kt'):
              p = Path('app/src/main/java/com/triplix/app') / name
              if p.exists():
                  p.unlink()

          p = Path('app/src/main/java/com/triplix/app/TriplixV4.kt')
          s = p.read_text()

          # Compose saveable lives in androidx.compose.runtime.saveable.
          s = s.replace(
              'import androidx.compose.runtime.rememberSaveable',
              'import androidx.compose.runtime.saveable.rememberSaveable'
          )

          # Kotlin/Compose 2.x is strict about Row/Column positional argument order.
          fixes = {
              'Column(Modifier.fillMaxSize(), Alignment.CenterHorizontally, Arrangement.Center)': 'Column(Modifier.fillMaxSize(), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center)',
              'Column(Modifier.fillMaxSize().padding(14.dp), Alignment.CenterHorizontally, Arrangement.Center)': 'Column(Modifier.fillMaxSize().padding(14.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center)',
              'Row(Modifier.padding(14.dp), Alignment.CenterVertically)': 'Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically)',
              'Row(Modifier.fillMaxWidth(), Alignment.CenterVertically)': 'Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically)',
              'Row(Modifier.fillMaxWidth().height(52.dp), Alignment.CenterVertically)': 'Row(Modifier.fillMaxWidth().height(52.dp), verticalAlignment = Alignment.CenterVertically)',
          }
          for old, new in fixes.items():
              s = s.replace(old, new)

          s = s.replace('@Composable private fun Mini4(', '@Composable private fun RowScope.Mini4(')
          s = s.replace('AnimatedVisibility(burst){Text("💥✨",fontSize=60.sp)}', 'if(burst){Text("💥✨",Modifier.align(Alignment.Center),fontSize=60.sp)}')

          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: triplix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
