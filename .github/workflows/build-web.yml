name: Build TRIPLIX Web

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web game
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: triplix-web-dist
          path: web/dist
