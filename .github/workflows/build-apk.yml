name: Build TRIPLIX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Normalize Compose source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/triplix/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.ui.graphics.Color', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.graphicsLayer')
          s = s.replace('LinearProgressIndicator(progress={mission/5f},Modifier', 'LinearProgressIndicator(progress={mission/5f},modifier=Modifier')
          s = s.replace('LinearProgressIndicator(progress = { mission / 5f }, Modifier', 'LinearProgressIndicator(progress = { mission / 5f }, modifier = Modifier')
          s = s.replace('Button(reward, enabled = mission >= 5, Modifier.fillMaxWidth()', 'Button(onClick = reward, enabled = mission >= 5, modifier = Modifier.fillMaxWidth()')
          s = s.replace('Worlds { page = "home" } { worldId = it; page = "levels" }', 'Worlds(back = { page = "home" }, choose = { worldId = it; page = "levels" })')
          s = s.replace('Levels(WORLDS[worldId], unlocked, { page = "worlds" }) { level = it; page = "game" }', 'Levels(world = WORLDS[worldId], unlocked = unlocked, back = { page = "worlds" }, choose = { level = it; page = "game" })')
          s = s.replace('AnimatedVisibility(visible = burst, enter = scaleIn() + fadeIn(), exit = scaleOut() + fadeOut()) { Text("💥", fontSize = 58.sp) }', 'if (burst) Text("💥", Modifier.align(Alignment.Center), fontSize = 58.sp)')
          s = s.replace('@Composable private fun Info(', '@Composable private fun RowScope.Info(')
          s = s.replace('AnimatedVisibility(burst,enter=fadeIn(tween(80))+scaleIn(tween(150)),exit=fadeOut(tween(200))+scaleOut(tween(200)),modifier=Modifier.align(Alignment.Center)){Text("💥✨",fontSize=78.sp)}', 'if(burst){Text("💥✨",Modifier.align(Alignment.Center),fontSize=78.sp)}')
          s = s.replace('if(win||over)AnimatedVisibility(true,enter=fadeIn(tween(140)),exit=fadeOut(tween(100))){', 'if(win||over){')
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: triplix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
