name: Build TRIPLIX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Normalize TRIPLIX source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # V2/V3 were prototypes and are no longer entry points. Keep the
          # repository history, but exclude their unfinished Kotlin sources
          # from the production build so one old screen cannot break the APK.
          for name in ('TriplixV2.kt', 'TriplixV3.kt'):
              p = Path('app/src/main/java/com/triplix/app') / name
              if p.exists():
                  p.unlink()

          p = Path('app/src/main/java/com/triplix/app/TriplixV4.kt')
          s = p.read_text()

          # Repair the V4 prototype's extra closing brace.
          s = s.replace('   }\n  }\n }\n }\n}\n\n@Composable private fun Top4', '   }\n  }\n }\n}\n\n@Composable private fun Top4')

          # Mini4 is used inside a Row and therefore needs RowScope for weight().
          s = s.replace('@Composable private fun Mini4(', '@Composable private fun RowScope.Mini4(')

          # Avoid AnimatedVisibility receiver inference in the board overlay.
          s = s.replace('AnimatedVisibility(burst){Text("💥✨",fontSize=60.sp)}', 'if(burst){Text("💥✨",Modifier.align(Alignment.Center),fontSize=60.sp)}')

          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: triplix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
